# FEMIS Portal Field Mapping
# Maps: portal field label -> source_field -> type/validation
# Labels MUST match the real FEMIS portal exactly.

# ============================================================
# TAB 1: Personal Details
# ============================================================
tab_1_personal_details:
  personal_information:
    name_of_student:
      label: "Name of Student"
      type: text
      required: true
      source_field: name

    is_cnic_form_b_available:
      label: "Is CNIC / Form-B Available?"
      type: radio
      required: true
      source_field: is_bform_available
      options: ["Yes", "No"]

    cnic_form_b_number:
      label: "CNIC / Form-B No."
      type: text
      required: true
      source_field: b_form
      validation: cnic

    gender:
      label: "Gender"
      type: dropdown
      required: true
      source_field: gender
      options: ["Male", "Female", "Transgender"]

    date_of_birth:
      label: "Date of Birth"
      type: date
      required: true
      source_field: date_of_birth
      format: "YYYY-MM-DD"

    province_of_birth:
      label: "Province of Birth"
      type: dropdown
      required: true
      source_field: birth_province_id

    district_of_birth:
      label: "District of Birth"
      type: dropdown
      required: true
      source_field: birth_district_id
      note: "Options depend on Province of Birth selection"

  domicile_information:
    nationality:
      label: "Nationality"
      type: dropdown
      required: true
      source_field: nationality
      options:
        - "Pakistani"
        - "Other"

    other_nationality:
      label: "Other Nationality"
      type: dropdown
      required: false
      source_field: nationality_id

    domicile_province:
      label: "Student Domicile — Province"
      type: dropdown
      required: false
      source_field: domicile_province_id

    domicile_district:
      label: "Student Domicile — District"
      type: dropdown
      required: false
      source_field: domicile_district_id

  address_temporary:
    address_type:
      label: "Address Type"
      type: dropdown
      required: true
      source_field: address_type
      options:
        - "Sector"
        - "Housing Society"
        - "Village"
        - "Other"

    sector:
      label: "Sector"
      type: dropdown
      required: false
      source_field: sector_id

    sub_sector:
      label: "Sub-Sector"
      type: dropdown
      required: false
      source_field: sub_sector_id

    village:
      label: "Village"
      type: dropdown
      required: false
      source_field: village_id

    housing_society:
      label: "Housing Society"
      type: dropdown
      required: false
      source_field: housing_society_id

    house_number:
      label: "House # (Temporary)"
      type: text
      required: false
      source_field: house

    street_number:
      label: "Street # (Temporary)"
      type: text
      required: false
      source_field: street

    contact_number:
      label: "Contact Number / WhatsApp"
      type: text
      required: true
      source_field: contact_number
      validation: mobile_pakistani

  address_permanent:
    city:
      label: "City"
      type: dropdown
      required: true
      source_field: city_id

    same_as_temporary:
      label: "Same as Temporary Address"
      type: checkbox
      source_field: same_address
      autofill: true

    address_type:
      label: "Address Type"
      type: dropdown
      required: true
      source_field: present_address_type

    sector:
      label: "Sector"
      type: dropdown
      required: false
      source_field: present_sector_id

    sub_sector:
      label: "Sub-Sector"
      type: dropdown
      required: false
      source_field: present_sub_sector_id

    village:
      label: "Village"
      type: dropdown
      required: false
      source_field: present_village_id

    housing_society:
      label: "Housing Society"
      type: dropdown
      required: false
      source_field: present_housing_society_id

    house_number:
      label: "House # (Permanent)"
      type: text
      source_field: present_house

    street_number:
      label: "Street # (Permanent)"
      type: text
      source_field: present_street

  religion_language_other:
    religion:
      label: "Religion"
      type: dropdown
      required: true
      source_field: religion
      options:
        - "Muslim"
        - "Non-Muslim"

    other_religion:
      label: "Other Religion"
      type: dropdown
      required: false
      source_field: religion_id

    mother_language:
      label: "Mother Language"
      type: dropdown
      required: true
      source_field: language_id

    other_language:
      label: "Other Language"
      type: text
      required: false
      source_field: mother_language_other

    blood_group:
      label: "Blood Group"
      type: dropdown
      required: false
      source_field: blood_group
      options:
        - "A+"
        - "A-"
        - "AB+"
        - "AB-"
        - "B+"
        - "B-"
        - "O+"
        - "O-"

    email:
      label: "Email ID"
      type: text
      required: true
      source_field: email
      validation: email

    girls_stipend:
      label: "Girls Stipend"
      type: radio
      required: false
      source_field: girls_stipend
      options: ["Yes", "No"]

    is_hafiz:
      label: "Is Hafiz-e-Quran?"
      type: radio
      required: false
      source_field: is_hafiz
      options: ["Yes", "No"]

