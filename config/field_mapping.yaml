      - "A lot of Difficulty"
      - "Cannot Do at All"

  # Vaccination
  basic_vaccination_completed:
    label: "Basic Vaccination Completed?"
    type: radio
    required: false
    source_field: basic_vaccination_completed
    options: ["Yes", "No"]

