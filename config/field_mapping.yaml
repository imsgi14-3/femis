# FEMIS Portal Field Mapping
# Maps: portal field name -> source field name -> type/validation
# Tab 1 is pre-filled from screenshots. Tabs 2-7 will be filled in Phase 2.

# ============================================================
# TAB 1: Personal Details
# ============================================================
tab_1_personal_details:
  personal_information:
    name_of_student:
      label: "Name of Student"
      type: text
      required: true
      source_field: name
      validation: alpha_with_spaces

    is_cnic_form_b_available:
      label: "Is CNIC/Form-B Available?"
      type: radio
      required: true
      source_field: is_bform_available
      options: ["Yes", "No"]

    gender:
      label: "Gender"
      type: dropdown
      required: true
      source_field: gender
      options: ["Male", "Female", "Transgender"]

    date_of_birth:
      label: "Date of Birth"
      type: date
      required: true
      source_field: date_of_birth
      format: "YYYY-MM-DD"

    province_of_birth:
      label: "Province of Birth"
      type: dropdown
      required: true
      source_field: birth_province_id
      options:
        - "Punjab"
        - "Balochistan"
        - "Sindh"
        - "KPK"
        - "ICT"
        - "Gilgit Baltistan"
        - "AJK"

    district_of_birth:
      label: "District of Birth"
      type: dropdown
      required: true
      source_field: birth_district_id
      note: "Options depend on Province of Birth selection"

  domicile_information:
    nationality:
      label: "Nationality"
      type: dropdown
      required: true
      source_field: nationality
      options:
        - "Pakistani"
        - "Others (specify)"

  address_temporary:
    address_type:
      label: "Address Type"
      type: dropdown
      required: true
      source_field: address_type
      options:
        - "Sector"
        - "Housing Society"
        - "Village"
        - "Others"

    house_number:
      label: "House #"
      type: text
      required: false
      source_field: house

    street_number:
      label: "Street #"
      type: text
      required: false
      source_field: street

    contact_number:
      label: "Contact Number / WhatsApp"
      type: text
      required: true
      source_field: contact_number
      validation: mobile_pakistani

  address_permanent:
    city:
      label: "City"
      type: dropdown
      required: true
      source_field: city_id

    same_as_temporary:
      label: "Same as Temporary Address"
      type: checkbox
      source_field: same_address

    address_type:
      label: "Address Type"
      type: dropdown
      required: true
      source_field: present_address_type

    house_number:
      label: "House #"
      type: text
      source_field: present_house

    street_number:
      label: "Street #"
      type: text
      source_field: present_street

  religion_language_other:
    religion:
      label: "Religion"
      type: dropdown
      required: true
      source_field: religion
      options:
        - "Muslim"
        - "Non-Muslim (specify)"

    mother_language:
      label: "Mother Language"
      type: dropdown
      required: true
      source_field: language_id
      options:
        - "Pashto"
        - "English"
        - "Saraiki"
        - "Punjabi"
        - "Balti"
        - "Shina"
        - "Urdu"
        - "Hindko"
        - "Sindhi"
        - "Balochi"

    blood_group:
      label: "Blood Group"
      type: dropdown
      required: false
      source_field: blood_group
      options:
        - "A+"
        - "A-"
        - "AB+"
        - "AB-"
        - "B+"
        - "B-"
        - "O+"
        - "O-"

    email:
      label: "Email ID"
      type: text
      required: false
      source_field: email
      validation: email

# ============================================================
# TAB 2: Parents / Guardian
# ============================================================
tab_2_parents_guardian:
  fathers_information:
    fathers_name:
      label: "Father's Name"
      type: text
      required: true
      source_field: father_name

    fathers_cnic:
      label: "Father's CNIC"
      type: text
      required: true
      source_field: father_cnic
      validation: cnic

    is_father_alive:
      label: "Is Father Alive"
      type: radio
      required: true
      source_field: is_father_alive
      options: ["Yes", "No"]

    contact_number:
      label: "Contact Number / WhatsApp"
      type: text
      required: true
      source_field: father_contact
      validation: mobile_pakistani

    landline_number:
      label: "Landline Number"
      type: text
      required: false
      source_field: father_landline
      validation: landline

    email:
      label: "Email"
      type: text
      required: false
      source_field: father_email
      validation: email

    qualification:
      label: "Father's Qualification"
      type: dropdown
      required: false
      source_field: father_qualification
      options:
        - "Below Matric"
        - "Matric"
        - "Intermediate"
        - "Graduate"
        - "Post Graduate"
        - "PhD"
        - "Other"

    profession:
      label: "Father's Profession"
      type: dropdown
      required: true
