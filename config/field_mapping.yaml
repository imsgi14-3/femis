      - "Cannot Do at All"

  difficulty_remembering:
    label: "Difficulty Remembering"
    type: radio
    required: false
    source_field: difficulty_remembering
    options:
      - "No Difficulty"
      - "Some Difficulty"
      - "A lot of Difficulty"
      - "Cannot Do at All"

  difficulty_concentrating:
    label: "Difficulty Concentrating"
    type: radio
    required: false
    source_field: difficulty_concentrating
    options:
      - "No Difficulty"
