    required: false
    source_field: has_hearing_difficulties
    options: ["Yes", "No"]

  using_hearing_aid:
    label: "Using hearing aid?"
    type: radio
    required: false
    source_field: uses_hearing_aid
    options: ["Yes", "No"]

  difficulty_listening:
    label: "Difficulty Listening?"
    type: radio
    required: false
    source_field: difficulty_listening
    options: ["Yes", "No"]

  # Walking
  difficulty_walking:
    label: "Difficulty Walking?"
    type: radio
    required: false
    source_field: difficulty_walking
    options: ["Yes", "No"]

  use_crutches_walker:
    label: "Use Crutches / Walker"
    type: radio
    required: false
    source_field: uses_crutches_walker
    options: ["Yes", "No"]

  # Learning
  difficulty_reading_writing:
