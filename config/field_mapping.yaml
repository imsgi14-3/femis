    class_admitted_in:
      label: Class Admitted In
      type: dropdown
      required: true
      source_field: class_admitted_id
      options:
      - Class 10
      - Class 6
      - Class 7
      - Class 8
      - Class 9
    last_institution_other_fde:
      label: Last Institution Other than FDE
      type: text
      required: false
      source_field: last_institution_other
    shift:
      label: Shift
      type: dropdown
      required: true
      source_field: shift
      options:
      - Morning
      - Evening
      note: Portal may expose as radio or select
    girls_stipend:
      label: Girls Stipend
      type: radio
      required: true
      source_field: girls_stipend
      options:
      - 'Yes'
      - 'No'
    medium_of_instruction:
      label: Medium of Instruction
      type: dropdown
      required: true
      source_field: medium_of_instruction
      options:
      - Urdu
      - English
    number_of_years_primary:
      label: Primary Education Completion (Years)
      type: text
      required: false
      source_field: primary_education_completion_years
      note: Not mandatory in FEMIS
    avail_institutional_meal:
      label: Meal Program
      type: radio
      required: true
      source_field: school_meal_program_availing
      options:
      - 'Yes'
      - 'No'
    mode_of_study:
      label: Mode of Study
      type: dropdown
      required: true
      source_field: mode_of_study
      options:
      - Day Scholar
      - Boarders
    transport_facility:
      label: Transport Facility
      type: radio
      required: true
      source_field: transport_facility
      options:
      - Institution Bus
      - Private
      - None
      note: DB column is transport (portal field transport_facility, aliased in webform_handler);
        option is Institution Bus (not Bus)
    group:
      label: Group
      type: dropdown
      required: false
      source_field: class_group_id
      note: Auto-discovered from portal DOM (map source_field to DB column when known)
      options:
      - Science Group
      - Computer Science Group
      - Technical Stream
      - Arts Group
    result_percentage_of_last_class_passed:
      label: Result / Percentage of Last Class passed
      type: text
      required: false
      source_field: result_percentage
      note: Auto-discovered from portal DOM (map source_field to DB column when known)
      placeholder: e.g. 75%
    last_institution_attended_other_than_fde:
      label: Last Institution Attended (other than FDE)
      type: text
      required: false
      source_field: last_other_institution
      note: Auto-discovered from portal DOM (map source_field to DB column when known)
