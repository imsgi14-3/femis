      options:
        - "Govt Employee"
        - "Private Employee"
        - "Businessman"
        - "Farmer"
        - "Overseas"
        - "Other"

    income_per_month:
      label: "Father's Income (per month)"
      type: dropdown
      required: false
      source_field: father_monthly_income
      options:
        - "Lessthan 50,000"
        - "50,001 - 100,000"
        - "100,001 - 200,000"
        - "200,001 - 300,000"
        - "Above 300,000"

    bps:
      label: "BPS (Only for Govt. Employees)"
      type: text
      required: false
      source_field: father_bps

    domicile_province:
      label: "Father Domicile - Province"
      type: dropdown
      required: false
      source_field: father_domicile_province_id

    domicile_district:
      label: "Father Domicile - District"
      type: dropdown
      required: false
      source_field: father_domicile_district_id

  mothers_information:
    mothers_name:
      label: "Mother's Name"
      type: text
      required: true
      source_field: mother_name

    is_mother_alive:
      label: "Is Mother Alive"
      type: radio
      required: true
      source_field: is_mother_alive
      options: ["Yes", "No"]

    mother_cnic:
      label: "Mother CNIC"
      type: text
      required: false
      source_field: mother_cnic
      validation: cnic

    contact_number:
      label: "Contact Number / WhatsApp"
      type: text
      required: true
      source_field: mother_contact
      validation: mobile_pakistani

    landline_number:
      label: "Landline Number"
      type: text
      required: false
      source_field: mother_landline
      validation: landline

    email:
      label: "Email"
      type: text
      required: false
      source_field: mother_email
      validation: email

    qualification:
      label: "Mother's Qualification"
      type: dropdown
      required: false
      source_field: mother_qualification
      options:
        - "Below Matric"
        - "Matric"
        - "Intermediate"
        - "Graduate"
        - "Post Graduate"
        - "PhD"
        - "Other"

    profession:
      label: "Mother's Profession"
      type: dropdown
      required: true
      source_field: mother_profession
      options:
        - "Govt Employee"
        - "Private Employee"
        - "Businesswoman"
        - "Farmer"
        - "Housewife"
        - "Other"

    income_per_month:
      label: "Mother's Income (per month)"
      type: dropdown
      required: false
      source_field: mother_monthly_income
      options:
        - "Lessthan 50,000"
        - "50,001 - 100,000"
        - "100,001 - 200,000"
        - "200,001 - 300,000"
        - "Above 300,000"

    bps:
      label: "BPS (Only for Govt. Employees)"
      type: text
      required: false
      source_field: mother_bps

  orphan_guardian_information:
    is_orphan_child:
      label: "Is Orphan Child"
      type: radio
      required: false
      source_field: is_orphan
      options: ["Yes", "No"]

    orphan_type:
      label: "Orphan Type"
      type: radio
      required: false
      source_field: orphan_type
      options: ["Double Orphan", "Single Orphan"]

    contact_number:
      label: "Contact Number / WhatsApp"
      type: text
      required: false
      source_field: guardian_contact
      validation: mobile_pakistani

    qualification:
      label: "Qualification"
      type: text
      required: false
      source_field: guardian_qualification

    profession:
      label: "Profession"
      type: dropdown
      required: false
      source_field: guardian_profession
      options:
        - "Govt Employee"
        - "Private Employee"
        - "Businessman"
        - "Farmer"
        - "Overseas"
        - "Other"

    income_per_month:
      label: "Income (per month)"
      type: text
      required: false
      source_field: guardian_income

    bps:
      label: "BPS (Only for Govt. Employees)"
      type: text
      required: false
      source_field: guardian_bps

    guardian_name:
      label: "Guardian Name"
      type: text
      required: false
      source_field: guardian_name

    guardian_cnic:
      label: "Guardian CNIC"
      type: text
      required: false
      source_field: guardian_cnic

    guardian_relation:
      label: "Guardian Relation"
      type: dropdown
      required: false
      source_field: guardian_relation
      options:
        - "Father"
        - "Mother"
        - "Brother"
        - "Sister"
        - "Uncle"
        - "Aunt"
        - "Grandfather"
        - "Grandmother"
        - "Other"

    guardian_email:
      label: "Guardian Email"
      type: text
      required: false
      source_field: guardian_email

# ============================================================
# TAB 3: Educational Details
# ============================================================
tab_3_educational_details:
  class_section:
    class:
      label: "Class"
      type: dropdown
      required: true
      source_field: class_id
      note: "Group field only for 9, 10, 11 & 12 grade students"

    section:
      label: "Section"
      type: radio
      required: true
      source_field: section_id
      options: ["A", "B", "C"]

    result_percentage:
      label: "Result / Percentage of Last Class passed"
      type: text
      required: false
      source_field: last_class_result

    date_of_admission:
      label: "Date of Admission"
      type: date
      required: true
      source_field: date_of_admission
      format: "YYYY-MM-DD"

    admission_number:
      label: "Admission Number"
      type: text
      required: false
      source_field: admission_number

    last_institution_under_fde:
      label: "Last institution Attended (Under FDE)"
      type: text
      required: false
      source_field: last_fde_institution_id

    class_admitted_in:
      label: "Class Admitted In"
      type: dropdown
      required: true
      source_field: class_admitted_id

    last_institution_other_fde:
      label: "Last institution Attended (Other than FDE)"
      type: text
      required: false
      source_field: last_institution_other

    shift:
      label: "Shift"
      type: radio
      required: true
      source_field: shift
      options: ["Morning", "Evening"]

    medium_of_instruction:
      label: "Medium of Instruction"
      type: radio
      required: true
      source_field: medium_of_instruction
      options: ["Urdu", "English"]

    number_of_years_primary:
      label: "Number of Years Spent Completing Primary Education"
      type: text
      required: false
      source_field: primary_education_completion_years

    avail_institutional_meal:
      label: "Availing Institutional Meal Program"
      type: radio
      required: false
      source_field: school_meal_program_availing
      options: ["Yes", "No"]

    mode_of_study:
      label: "Mode of Study"
      type: radio
      required: true
      source_field: mode_of_study
      options: ["Day Scholar", "Boarders"]

  sibling_details:
    total_siblings:
      label: "Total Number of Siblings"
      type: text
      required: false
      source_field: total_siblings

    in_other_fde:
      label: "In Other FDE institutions"
      type: text
      required: false
      source_field: siblings_other_fde

    is_same_institution:
      label: "Is Same Institution"
      type: radio
      required: false
      source_field: siblings_same
      options: ["Yes", "No"]

    in_private_institutions:
      label: "In Private institutions"
      type: text
      required: false
      source_field: siblings_private

  transport_facility:
    transport_facility:
      label: "Transport Facility"
      type: radio
      required: false
      source_field: transport
      options: ["Institution Bus", "Private"]

  scholarships_and_co_curricular:
    recipient_of_scholarship:
      label: "Recipient of Scholarship?"
      type: radio
      required: false
      source_field: scholarship
      options: ["Yes", "No"]

    special_interest:
      label: "Special Interest/Achievement in co-curricular Activities"
      type: radio
      required: false
      source_field: cocurricular_activities
      options: ["Yes", "No"]

    scholarship_details:
      label: "Scholarship Details"
      type: text
      required: false
      source_field: scholarship_details

    achievement_details:
      label: "Achievement Details"
      type: text
      required: false
      source_field: achievement_details

# ============================================================
# TAB 4: Emergency Contact
# ============================================================
tab_4_emergency_contact:
  emergency_contact_name:
    label: "Emergency Contact Name"
    type: text
    required: true
    source_field: emergency_name

  contact_number:
    label: "Contact Number"
    type: text
    required: true
    source_field: emergency_contact
    validation: mobile_pakistani

  relation:
    label: "Relation"
    type: dropdown
    required: true
    source_field: emergency_relation
    options:
      - "Father"
      - "Mother"
      - "Sister"
      - "Brother"
      - "Aunt"
      - "Uncle"
      - "Other"

# ============================================================
# TAB 5: IDPs Details
# ============================================================
tab_5_idps_details:
  is_student_refugee_idp:
    label: "Is Student a Refugee/IDP"
    type: radio
    required: false
